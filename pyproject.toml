[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-weekly-agent"
version = "0.1.0"
description = "Portable weekly policy collection, MI-like workbook export and email delivery"
requires-python = ">=3.10"
dependencies = ["requests>=2.31,<3", "beautifulsoup4>=4.12,<5", "openpyxl>=3.1,<4", "pypdf>=5.0,<6", "PyYAML>=6.0,<7", "olefile==0.47", "pypdfium2>=4.30,<6", "rapidocr==3.9.2", "onnxruntime>=1.22,<2", "Pillow>=11,<13", "xlrd>=2,<3"]

[project.scripts]
policy-weekly = "policy_agent.cli:main"

[tool.setuptools.package-data]
policy_agent = ["data/*.json"]
